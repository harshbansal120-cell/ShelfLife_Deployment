services:
  bifrost:
    image: maximhq/bifrost:latest
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: "8080"
      BIFROST_SETUP_TOKEN: ${BIFROST_SETUP_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    volumes:
      # Bifrost uses the mounted folder as its app dir (config.json, config.db, logs.db).
      - ./bifrost:/app/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Vector store for Bifrost's semantic cache. Must support the FT.* commands.
  redis:
    image: redis/redis-stack:latest
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  redis-data:

[project]
name = "shelflife-backend"
version = "0.1.0"
description = "ShelfLife: a stale-answer detector for AI apps"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.164.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["-m", "not live"]
markers = [
    "live: calls real Bifrost/Tavily and may spend credits (run with: uv run pytest -m live)",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]
